<svg xmlns="http://www.w3.org/2000/svg" width="960" height="280" viewBox="0 0 960 280" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="banner-title banner-description">
  <title id="banner-title">Small steps. Better code.</title>
  <desc id="banner-description">A dark terminal-style banner for lmavour with mint-green lettering and connected code nodes.</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15212b" />
      <stop offset="1" stop-color="#0d131b" />
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#263844" stroke-width="1" />
    </pattern>
    <clipPath id="frame">
      <rect width="960" height="280" rx="20" />
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="960" height="280" fill="url(#surface)" />
    <rect x="564" y="68" width="396" height="212" fill="url(#grid)" opacity="0.45" />
    <path d="M28 68H932" stroke="#2b3b48" stroke-width="1" />

    <g font-family="Consolas, 'Liberation Mono', monospace">
      <text x="56" y="44" fill="#9be5bc" font-size="20">&gt;_</text>
      <text x="94" y="43" fill="#a4b3bf" font-size="17">lmavour@learning</text>
    </g>
    <g fill="#526776">
      <rect x="874" y="34" width="7" height="7" rx="1" />
      <rect x="890" y="34" width="7" height="7" rx="1" />
      <rect x="906" y="34" width="7" height="7" rx="1" fill="#9be5bc" />
    </g>

    <g font-family="Consolas, 'Liberation Mono', monospace" font-size="55" font-weight="700" letter-spacing="-2">
      <text x="56" y="137" fill="#f0f6fc">Small steps.</text>
      <text x="56" y="198" fill="#9be5bc">Better code.</text>
    </g>
    <text x="58" y="242" fill="#91a3b0" font-family="Consolas, 'Liberation Mono', monospace" font-size="16">learn / experiment / repeat</text>

    <g fill="none">
      <circle cx="753" cy="160" r="91" stroke="#293d48" stroke-width="1" stroke-dasharray="3 9" />
      <circle cx="753" cy="160" r="63" stroke="#20343e" stroke-width="1" />
      <g stroke="#6abf9f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M618 104H662Q678 104 678 120V146H710" />
        <path d="M796 146H830Q846 146 846 120V104H880" />
        <path d="M614 222H662Q678 222 678 206V176H710" />
        <path d="M796 176H830Q846 176 846 204V218H880" />
      </g>
      <path d="M580 158H618M890 158H928" stroke="#354e5b" stroke-width="1" />
    </g>

    <rect x="710" y="120" width="86" height="80" rx="16" fill="#172b31" stroke="#9be5bc" stroke-width="1.5" />
    <text x="753" y="170" fill="#b9f3d1" font-family="Consolas, 'Liberation Mono', monospace" font-size="31" text-anchor="middle">&lt;/&gt;</text>

    <g fill="#13232b" stroke="#6abf9f" stroke-width="1.5">
      <circle cx="608" cy="104" r="10" />
      <circle cx="890" cy="104" r="10" />
      <circle cx="604" cy="222" r="10" />
      <circle cx="890" cy="218" r="10" />
    </g>
    <g fill="#9be5bc">
      <circle cx="608" cy="104" r="3" />
      <circle cx="604" cy="222" r="3" />
      <circle cx="890" cy="218" r="3" />
    </g>
    <circle cx="890" cy="104" r="3" fill="#f4b58b" />
  </g>

  <rect x="0.5" y="0.5" width="959" height="279" rx="19.5" fill="none" stroke="#2c3e4a" />
</svg>
